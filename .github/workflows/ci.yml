name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # We install via the pip interface (no uv.lock), so key the cache on
          # the dependency declarations instead of the default **/uv.lock glob.
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        # The runner's system Python is externally managed (PEP 668), so install
        # into a uv-managed venv on the matrix interpreter rather than --system.
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install project (dev + experiments extras)
        # experiments pulls guideline-gpt from GitHub per [tool.uv.sources]; the
        # full test suite (judges/runner) needs it. The dashboard image installs
        # base deps only.
        run: uv pip install -e ".[dev,experiments]"

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy src

      - name: pytest
        run: uv run pytest --cov=eval_harness --cov-report=term-missing
