# One-command results dashboard: `docker compose up --build`
#
# No API keys, no live experiments — the dashboard serves the pre-computed
# results baked into the image. The bind mounts let you point it at updated
# results / dataset on the host without rebuilding.

services:
  dashboard:
    build: .
    image: guideline-gpt-evals:latest
    container_name: guideline-gpt-evals
    ports:
      - "8501:8501"
    # Long-form bind mounts: the short `./path:/target:ro` form mis-parses on
    # Windows because of the drive-letter colon (D:\...). Results/dataset are
    # also baked into the image, so the app works even without these mounts.
    volumes:
      - type: bind
        source: ./results
        target: /app/results
        read_only: true
      - type: bind
        source: ./eval_dataset
        target: /app/eval_dataset
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
