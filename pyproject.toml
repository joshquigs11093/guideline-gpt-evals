[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guideline-gpt-evals"
version = "0.1.0"
description = "A rigorous evaluation framework for RAG systems, demonstrated against guideline-gpt."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Quigley" }]
requires-python = ">=3.11"
keywords = ["rag", "evaluation", "llm-as-judge", "ragas", "deepeval", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # The system under test, imported as a dependency (see [tool.uv.sources]).
    "guideline-gpt",
    # Eval primitives — build on standards, don't reinvent (spec §16.6).
    "ragas>=0.2",
    "deepeval>=1.0",
    # Data + stats
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # Results viewer
    "streamlit>=1.38",
    "plotly>=5.23",
    # CLI / config / logging — match parent project conventions.
    "typer>=0.12",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Notebook authoring + HTML export for the analysis narrative (spec §7).
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
eval-harness = "eval_harness.cli:app"

[project.urls]
Homepage = "https://github.com/joshquigs11093/guideline-gpt-evals"
Repository = "https://github.com/joshquigs11093/guideline-gpt-evals"
Companion = "https://github.com/joshquigs11093/guideline-gpt"

# ---------------------------------------------------------------------------
# Dependency sources
# ---------------------------------------------------------------------------
# guideline-gpt is the system under test. By default we pull it from GitHub so a
# fresh clone (and CI) resolves without extra steps. For local development of
# both repos in tandem, override with an editable install of the sibling clone:
#
#     uv pip install -e ../guideline-gpt
#
[tool.uv.sources]
guideline-gpt = { git = "https://github.com/joshquigs11093/guideline-gpt.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

# ---------------------------------------------------------------------------
# Tooling — identical conventions to guideline-gpt (spec §2.1, §15).
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear,
# C4 comprehensions, SIM simplify, D pydocstyle (Google), ANN annotations
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D", "ANN"]
ignore = [
    "D107",   # missing docstring in __init__ (documented at class level)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]      # tests need not be docstring/annotation-strict
"scripts/**" = ["D", "ANN"]
"src/eval_harness/ui/**" = ["ANN", "D"]  # Streamlit scripts: skip annotation/docstring rules

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party libs that ship without (complete) type stubs.
module = [
    "ragas.*",
    "deepeval.*",
    "plotly.*",
    "streamlit.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["eval_harness"]
omit = ["*/ui/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
